<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aktivasi MonevHub AI</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; min-height: 100vh; background: #f8fafc; color: #0f172a;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 390px; background: #ffffff; border: 1px solid #e2e8f0;
      border-radius: 18px; padding: 22px; box-shadow: 0 8px 24px rgba(15,23,42,0.06);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .badge {
      width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #1e3a8a, #2563eb, #4f46e5);
      color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 17px; font-weight: 800; margin: 0; }
    .sub { font-size: 12px; color: #64748b; margin: 2px 0 0; }
    label { display: block; font-size: 11.5px; font-weight: 600; color: #334155; margin: 10px 0 4px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px;
      font-size: 13px; color: #0f172a; background: #fff;
    }
    input[readonly] { background: #f8fafc; color: #475569; }
    button {
      width: 100%; margin-top: 14px; padding: 11px 14px; border: none; border-radius: 10px;
      background: #2563eb; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.65; }
    .msg { margin-top: 10px; font-size: 12px; color: #dc2626; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="badge">M</div>
      <div>
        <h1>Aktivasi MonevHub AI</h1>
        <p class="sub">Aktifkan lisensi perangkat sebelum masuk ke portal.</p>
      </div>
    </div>
    <label for="gate-dev">Perangkat (Terdeteksi Otomatis)</label>
    <input id="gate-dev" type="text" readonly>
    <label for="gate-key">Kunci Lisensi</label>
    <input id="gate-key" type="text" placeholder="MH-XXXX-XXXX-XXXX">
    <label for="gate-owner">Nama Pemilik</label>
    <input id="gate-owner" type="text" placeholder="Nama Anda">
    <button id="gate-btn" type="button">Aktivasi Perangkat</button>
    <div id="gate-msg" class="msg"></div>
  </div>
  <script>
    (function () {
      if (!window.chrome) window.chrome = {};
      if (!window.chrome.storage) {
        window.chrome.storage = {
          local: {
            get: function (keys) {
              return new Promise(function (resolve) {
                var out = {};
                var arr = typeof keys === 'string' ? [keys] : (Array.isArray(keys) ? keys : Object.keys(keys || {}));
                arr.forEach(function (k) {
                  var raw = window.AndroidBridge ? window.AndroidBridge.getStorageItem(k) : '';
                  if (raw) {
                    try { out[k] = JSON.parse(raw); } catch (e) { out[k] = raw; }
                  }
                });
                resolve(out);
              });
            },
            set: function (obj) {
              return new Promise(function (resolve) {
                if (window.AndroidBridge && obj) {
                  Object.keys(obj).forEach(function (k) {
                    window.AndroidBridge.setStorageItem(k, JSON.stringify(obj[k]));
                  });
                }
                resolve();
              });
            },
            remove: function (keys) {
              return new Promise(function (resolve) {
                var arr = Array.isArray(keys) ? keys : [keys];
                if (window.AndroidBridge) {
                  arr.forEach(function (k) { window.AndroidBridge.setStorageItem(k, ''); });
                }
                resolve();
              });
            }
          }
        };
      }
      if (window.AndroidBridge && window.AndroidBridge.httpRequest) {
        window.fetch = async function (input, init) {
          init = init || {};
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          var method = (init.method || 'GET').toUpperCase();
          var body = typeof init.body === 'string' ? init.body : '';
          var raw = window.AndroidBridge.httpRequest(url, method, body, JSON.stringify(init.headers || {}));
          var parsed = JSON.parse(raw || '{}');
          if (parsed.status === 0 && parsed.error) throw new TypeError(parsed.error);
          var txt = parsed.text || '';
          return {
            ok: Boolean(parsed.ok),
            status: parsed.status || 200,
            text: async function () { return txt; },
            json: async function () { return JSON.parse(txt); }
          };
        };
      }
    })();
  </script>
  <script src="file:///android_asset/lib/license.js"></script>
  <script>
    (async function () {
      var devEl = document.getElementById('gate-dev');
      var keyEl = document.getElementById('gate-key');
      var ownerEl = document.getElementById('gate-owner');
      var btn = document.getElementById('gate-btn');
      var msgEl = document.getElementById('gate-msg');

      var autoDev = window.MonevHubLicense ? window.MonevHubLicense.detectDeviceLabel() : 'HP - Android';
      devEl.value = autoDev;

      if (window.MonevHubLicense) {
        var check = await window.MonevHubLicense.verify(false);
        if (check.valid && window.AndroidBridge && window.AndroidBridge.openPortalAfterActivation) {
          window.AndroidBridge.openPortalAfterActivation();
          return;
        }
      }

      btn.addEventListener('click', async function () {
        var key = (keyEl.value || '').trim();
        var owner = (ownerEl.value || '').trim();
        msgEl.textContent = '';
        if (!key) { msgEl.textContent = 'Masukkan kunci lisensi.'; return; }
        btn.disabled = true;
        btn.textContent = 'Memverifikasi...';
        try {
          var res = await window.MonevHubLicense.activate(key, autoDev, owner);
          if (res.success) {
            msgEl.style.color = '#059669';
            msgEl.textContent = 'Aktivasi berhasil! Membuka portal...';
            if (window.AndroidBridge && window.AndroidBridge.openPortalAfterActivation) {
              window.AndroidBridge.openPortalAfterActivation();
            }
          } else {
            msgEl.style.color = '#dc2626';
            msgEl.textContent = res.message || 'Aktivasi ditolak.';
          }
        } catch (e) {
          msgEl.style.color = '#dc2626';
          msgEl.textContent = 'Gagal aktivasi: ' + e.message;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Aktivasi Perangkat';
        }
      });
    })();
  </script>
</body>
</html>
